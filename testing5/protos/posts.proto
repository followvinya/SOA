syntax = "proto3";

package posts;

service PostService {
  rpc CreatePost (CreatePostRequest) returns (Post) {}
  rpc GetPost (GetPostRequest) returns (Post) {}
  rpc ListPosts (ListPostsRequest) returns (ListPostsResponse) {}
  rpc UpdatePost (UpdatePostRequest) returns (Post) {}
  rpc DeletePost (DeletePostRequest) returns (DeletePostResponse) {}

  rpc LikePost (LikePostRequest) returns (LikePostResponse) {}
  rpc ViewPost (ViewPostRequest) returns (ViewPostResponse) {}
  rpc AddComment (AddCommentRequest) returns (Comment) {}
  rpc GetPostComments (GetPostCommentsRequest) returns (GetPostCommentsResponse) {}
}

message CreatePostRequest {
  string title = 1;
  string description = 2;
  int32 creator_id = 3;
  bool is_private = 4;
  repeated string tags = 5;
}

message GetPostRequest {
  int32 id = 1;
  int32 user_id = 2;  // ID пользователя, запрашивающего пост
}

message ListPostsRequest {
  int32 page = 1;
  int32 page_size = 2;
  int32 user_id = 3;  // ID пользователя, для которого запрашиваются посты
}

message UpdatePostRequest {
  int32 id = 1;
  string title = 2;
  string description = 3;
  int32 creator_id = 4;  // используется для проверки авторизации
  bool is_private = 5;
  repeated string tags = 6;
}

message DeletePostRequest {
  int32 id = 1;
  int32 creator_id = 2;  // используется для проверки авторизации
}

message DeletePostResponse {
  bool success = 1;
}

message Post {
  int32 id = 1;
  string title = 2;
  string description = 3;
  int32 creator_id = 4;
  string created_at = 5;
  string updated_at = 6;
  bool is_private = 7;
  repeated string tags = 8;
}

message ListPostsResponse {
  repeated Post posts = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message LikePostRequest {
  int32 post_id = 1;
  int32 user_id = 2;
}

message LikePostResponse {
  bool success = 1;
  int32 like_id = 2;
}

message ViewPostRequest {
  int32 post_id = 1;
  int32 user_id = 2;
}

message ViewPostResponse {
  bool success = 1;
  int32 view_id = 2;
}

message Comment {
  int32 id = 1;
  int32 post_id = 2;
  int32 user_id = 3;
  string text = 4;
  string created_at = 5;
  string updated_at = 6;
}

message AddCommentRequest {
  int32 post_id = 1;
  int32 user_id = 2;
  string text = 3;
}

message GetPostCommentsRequest {
  int32 post_id = 1;
  int32 user_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetPostCommentsResponse {
  repeated Comment comments = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}